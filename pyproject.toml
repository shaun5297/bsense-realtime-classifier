[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsense-realtime-classifier"
version = "0.2.0"
description = "FP1/FP2 LSL inference and safe P300 Unitree control for BSense"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib>=1.3",
  "numpy>=2.0",
  "pylsl==1.18.2",
  "scikit-learn>=1.5",
  "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
xdf = ["pyxdf>=1.16"]
deep = ["torch>=2.4"]

[project.scripts]
bsense-classifier = "bsense_classifier.app:main"
bsense-classifier-cli = "bsense_classifier.cli:main"
bsense-dog-controller = "bsense_classifier.robot_app:main"
bsense-train-p300 = "bsense_classifier.p300_training:main"
bsense-train-p300-eegnet = "bsense_classifier.p300_eegnet_training:main"
bsense-unitree-http-gateway = "bsense_classifier.http_gateway:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]
